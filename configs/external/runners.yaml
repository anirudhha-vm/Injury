# Injury-risk pipeline on real data: Lövdal, den Hartigh & Azzopardi (2021), competitive
# runners. DataverseNL doi:10.34894/UWU9PV, CC0 1.0. 74 Dutch high-level runners (27 women,
# 47 men), training logs 2012-2019 with injury flags. Adult runners: a check of the evaluation
# machinery on real outcomes, NOT evidence about growth-related injury in youth.
source:
  target: data/external/runners
  files:                     # DataverseNL datafile id -> name, sha256
    - {id: 47971, name: week_approach_maskedID_timeseries.csv, sha256: 261ba3a481f3428611cc175eac2b67749ee3d97980d81168af13bd9f932d5a31}
    - {id: 47972, name: day_approach_maskedID_timeseries.csv, sha256: 9c06ecefae9caa4ca831c08c7ebe4d25b0b01e8aa285df526a4e6791c673b6e8}
    - {id: 422690, name: README.txt, sha256: 60cb848f9cb0c18c374af03627ff698b3e31dbc49e614afe21f0c7931e1e04f0}
  url_template: https://dataverse.nl/api/access/datafile/{id}
label: injury                # injury on the event day (the dataset's own flag)
weeks: 3                     # feature weeks before the event day: w0 = the week before
origin_date: "2012-01-01"    # nominal; the file gives days since its first record
n_folds: 5
temporal_holdout_fraction: 0.25   # N3: last quarter of calendar time
seed: 20261021
load_only_predictors:        # parsimonious reference model: load in each of the three weeks
  - total_kms_w0             # and the week-to-week change (ACWR-like)
  - total_kms_w1
  - total_kms_w2
  - log_ratio_kms_w0_w1
models: [load_only, penalised_logistic, gradient_boosting]
reference_model: load_only
penalised_logistic:          # elastic net; as hazard_logit in models/hazard.yaml, no splines
  penalty: elastic_net
  C: 0.1                     # ASSUMPTION: 66 correlated inputs; stronger shrinkage than hazard.yaml
  l1_ratio: 0.5
  max_iter: 5000
  class_weight: null
  n_spline_knots: 4
  spline_terms: []
gradient_boosting: {n_estimators: 300, max_depth: 3, learning_rate: 0.03, subsample: 0.8, colsample_bytree: 0.5, min_child_weight: 20}   # ASSUMPTION
metrics: [time_dependent_auc_4wk, pr_auc, brier_score, calibration_intercept, calibration_slope]
bootstrap_resamples: 500
published_auc:               # what the dataset's authors reported (week approach), for context
  value: 0.678               # [[CITED: Lövdal et al. 2021 IJSPP 16(10):1522]]
