# Discrete-time cause-specific hazard models (contribution C3). Used from M5-M6.
time_unit: athlete_week
prediction_horizon_weeks: 4
outcome_groups: [growth_related, non_contact_soft_tissue, all_non_contact]   # N6: modelled separately
primary_outcome: growth_related
risk_set:
  exclude_while_injured: true
screening_carry_forward: locf_with_weeks_since_screen
exposure:
  ewma: true
  acwr_as_primary: false
class_imbalance:
  smote: false               # never on person-period data
# Confirmatory model (docs/RESEARCH_STRATEGY.md, decision 1): predictors are taken from this
# pre-specified list, in order, and only as many as the achieved number of athletes and events
# supports under the Riley et al. criteria. Fixed before outcome data are seen.
confirmatory:
  candidate_predictors_in_order:
    - obs_leg_length_velocity                   # growth velocity
    - twin_maturity_offset_mean                 # maturity timing from the growth twin
    - mech_patellar_tendon_load_proxy_bw        # one landing-load measure
    - moore_maturity_offset                     # used only if the twin feature is unavailable
    - ewma_hours                                # exposure
  max_parameters: 5
  C: 1000.0                   # effectively unpenalised: the parameter count is the control
  max_iter: 5000
# Everything below is EXPLORATORY unless the cohort reaches the event count its size needs.
# Hyperparameters below are starting values (ASSUMPTION); they are tuned in inner folds (M7).
hazard_logit:
  penalty: elastic_net
  C: 0.5                      # inverse regularisation strength
  l1_ratio: 0.5
  max_iter: 5000
  class_weight: null          # proper likelihood first; weights only if needed
  n_spline_knots: 4           # natural cubic splines, knots at training-fold quantiles
  spline_terms: [age, moore_maturity_offset, obs_height_velocity, obs_leg_length_velocity]
hazard_xgb:
  n_estimators: 200
  max_depth: 3
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  min_child_weight: 5
  monotone_constraints: {}    # optional: {feature_name: 1 or -1}
hazard_neural: {head: small_mlp, film: optional}   # M6
uncertainty:
  posterior_draw_propagation: true
  deep_ensemble_seeds: 5
  split_conformal: optional
