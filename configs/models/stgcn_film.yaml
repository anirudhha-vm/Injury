# ST-GCN encoder variant on the lower-limb joint graph (contribution C2).
backbone: stgcn
hidden: 32
n_blocks: 3
kernel_size: 9               # temporal kernel
embedding_dim: 16
dropout: 0.1
film_hidden: 32
max_params: 200000
conditioning: film           # none | concat_input | late_fusion | film
sequence_length: 101
normalisation: train_fold_only   # non-negotiable N4
